[package]
name = "rd"
version = "0.0.0"
edition = "2021"
description = "活镜 wire 枚举、编解码、页面状态机；Android .so 与 WASM 两端和 bench 共用"

[lib]
crate-type = ["rlib", "cdylib"]   # cdylib 供 wasm32-unknown-unknown 产出 rd.wasm

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_json = "1"
ruzstd = "0.8"          # 纯 Rust 解码：A 端（wasm）用；B 端编码用下面的 zstd

# B 端 / bench 才需要的编码器（C 库 zstd、JPEG 编码），wasm 里不要
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"
jpeg-encoder = "0.7"
