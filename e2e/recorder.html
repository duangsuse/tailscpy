<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活镜录制器</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f4f2; --panel:#fff; --ink:#1b1b1a; --dim:#6b6b66; --line:#dcdcd6; --acc:#1f6feb; --ok:#1a7f37; --warn:#b35900; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#202020; --ink:#ececea; --dim:#9a9a94; --line:#333330; --acc:#5aa2ff; --ok:#3fb950; --warn:#e3a008; --bad:#ff6b6b; } }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,"Noto Sans CJK SC",sans-serif; height:100vh; display:flex; overflow:hidden }
  #stage { flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:12px; height:100vh }
  #screen { height:calc(100vh - 24px); aspect-ratio:1080/2640; background:#000; border-radius:10px; border:1px solid var(--line); cursor:crosshair; touch-action:none; user-select:none; -webkit-user-drag:none; display:block }
  #wrap { position:relative; line-height:0 } #trail { position:absolute; inset:0; pointer-events:none; border-radius:10px }
  #side { flex:1; min-width:320px; max-width:560px; margin:12px 12px 12px 0; background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0 }
  .sec { padding:12px 14px; border-bottom:1px solid var(--line) }
  .sec h3 { margin:0 0 8px; font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--dim); text-transform:uppercase }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  select, input, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 9px }
  input[type=number] { width:76px }
  button { cursor:pointer } button:hover { border-color:var(--acc) } button.pri { background:var(--acc); border-color:var(--acc); color:#fff }
  button:disabled { opacity:.45; cursor:default }
  #status { font-size:13px; color:var(--dim); min-height:20px } #status.busy { color:var(--warn) } #status.err { color:var(--bad) } #status.ok { color:var(--ok) }
  #steps { flex:1; overflow:auto; padding:6px 14px 14px; min-height:0 }
  .step { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); align-items:flex-start }
  .step img { width:54px; aspect-ratio:1080/2640; object-fit:cover; border-radius:4px; border:1px solid var(--line); flex:none; background:#000 }
  .step.fail { background:color-mix(in srgb, var(--bad) 8%, transparent) } .step .pair { display:flex; gap:6px; margin-top:4px } .step .pair figure { margin:0 } .step .pair figcaption { font-size:11px; color:var(--dim) }
  .step b { font-weight:600 } .step small { color:var(--dim); display:block }
  .tag { display:inline-block; padding:0 6px; border-radius:9px; font-size:11px; border:1px solid var(--line); color:var(--dim); margin-left:4px }
  .tag.warn { color:var(--warn); border-color:var(--warn) }
  .hint { color:var(--dim); font-size:12px; line-height:1.6 }
  kbd { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px }
  #hover { flex:1 1 0; min-width:0; margin:12px 12px 12px 0; display:none; align-items:center; justify-content:center; gap:10px } #hover figure { margin:0; text-align:center; min-width:0 } #hover img { height:calc(100vh - 70px); max-width:100%; aspect-ratio:1080/2640; object-fit:contain; background:#000; border-radius:10px; border:1px solid var(--line) } #hover figcaption { font-size:12px; color:var(--dim); padding-top:4px } #hover .empty { color:var(--dim); font-size:13px }
  @media (min-width: 1250px) { #hover { display:flex } }
  @media (max-width: 760px) { body { flex-direction:column; overflow:auto; height:auto } #stage { height:auto } #screen { height:60vh } #side { margin:0 12px 12px; max-width:none } }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><img id="screen" alt="设备画面" draggable="false"><canvas id="trail"></canvas></div></div>
<div id="side">
  <div class="sec">
    <h3>1 · 保存位置（由本服务落盘）</h3>
    <div class="row"><code id="dir">检查中…</code></div>
    <div class="hint" style="margin-top:6px" id="hostinfo"></div>
    <div class="hint" style="margin-top:6px">每个 App 写 <code>&lt;包名&gt;.jsonl</code> + <code>&lt;包名&gt;/NNNN.png</code>；<code>node e2e/run.mjs</code> 直接回放。每步写完会读回校验大小。</div>
  </div>
  <div class="sec">
    <h3>2 · 录制哪个 App（选中即打开并开始录制，点“保存此重录”才落成 case）</h3>
    <div class="row"><select id="app"></select><button id="save" class="pri" disabled>保存此重录</button></div>
  </div>
  <div class="sec">
    <h3>回放已录制的 case</h3>
    <div class="row"><select id="case"></select><label>容差 <input id="tol" type="number" value="0.1" step="0.05" min="0"> %</label><button id="replay" class="pri">回放</button></div>
  </div>
  <div class="sec">
    <h3>3 · 每步等待（默认：等变化阈值，再等静止，然后截图）</h3>
    <div class="row">
      <label>变化阈值 <input id="wchange" type="number" value="0.5" step="0.1" min="0.1"> % 行</label>
      <label>静止 <input id="wsettle" type="number" value="500" step="50" min="50"> ms</label>
      <label>上限 <input id="wtimeout" type="number" value="3000" step="500" min="500"> ms</label>
    </div>
    <div class="row" style="margin-top:6px"><span class="hint">忽略行带（走马灯 / 转圈等一直在变的区域，不参与等待与比对）：</span><span id="ign" class="hint">无</span><button id="ignclr" disabled>清除</button></div>
  </div>
  <div class="sec"><div id="status">就绪</div></div>
  <div id="steps"></div>
</div>
<div id="hover"><span class="empty">悬停左侧步骤列表可在这里预览截图</span></div>
<script>
const $ = id => document.getElementById(id)
let sess = null, busy = false, ignore = []

const status = (t, c = '', act) => { $('act')?.remove(); if (act) { const b = document.createElement('button'); b.id = 'act'; b.textContent = act[0]; b.onclick = act[1]; $('status').after(b) }; $('status').textContent = t; $('status').className = c }
const post = async (u, b) => { try { return await (await fetch(u, { method: 'POST', body: JSON.stringify(b || {}) })).json() } catch (e) { return { ok: false, err: '请求失败：' + e.message } } }

function showIgnore() { $('ign').textContent = ignore.length ? ignore.map(r => `y ${r[0]}–${r[1]}`).join('，') : '无'; $('ignclr').disabled = !ignore.length }
$('ignclr').onclick = async () => { ignore = []; showIgnore(); await post('/api/ignore', { ignore }) }
// ── 预览 ──
const img = $('screen')
let geom = { w: 1080, h: 2640 }
const es = new EventSource('/api/stream')
es.onmessage = e => { const m = JSON.parse(e.data); geom = { w: m.w, h: m.h }; img.src = 'data:image/jpeg;base64,' + m.img }

// ── 信息、App 列表 ──
async function loadInfo() {
  const i = await (await fetch('/api/info')).json()
  $('dir').textContent = i.cases + (i.existing.length ? `（已有 ${i.existing.length} 份：${i.existing.join('、')}）` : '（暂无）')
  $('hostinfo').textContent = i.host.error ? '⚠ ' + i.host.error : `host 就绪：${i.host.dev}`
  if (i.host.error) { status(i.host.error, 'err'); return }
  const r = await (await fetch('/api/apps')).json()
  if (!r.ok) return status('取 App 列表失败：' + r.err, 'err')
  $('app').innerHTML = '<option value="">— 选择 App 开始录制 —</option>' + r.apps.map(a => `<option>${a}</option>`).join('')
  $('case').innerHTML = i.existing.length ? i.existing.map(a => `<option>${a}</option>`).join('') : '<option value="">（还没有录制）</option>'
  $('replay').disabled = !i.existing.length
}
const waitOpts = () => ({ change: +$('wchange').value / 100, settle_ms: +$('wsettle').value, timeout_ms: +$('wtimeout').value, ignore })

async function openApp() {
  busy = true; status('打开 App…', 'busy'); $('steps').innerHTML = ''; ignore = []; showIgnore()
  const pkg = $('app').value
  if (!pkg) { busy = false; return }
  const r = await post('/api/open', { pkg, wait: waitOpts() })
  if (!r.ok) { busy = false; return status('打开失败：' + r.err, 'err') }
  sess = r.session; show(r.first)
  $('save').disabled = false; busy = false
  status(`录制中：${pkg}（${sess.w}×${sess.h}@${sess.dpi}）`, 'ok')
}
$('app').onchange = () => { if ($('app').value && !busy) openApp(); else if (busy) status('正在忙，稍后再换 App', 'busy') }
$('save').onclick = async () => {
  if (!sess || busy) return
  const name = prompt(`保存此重录。\n用例名（留空 = 覆盖 ${sess.pkg}.jsonl）：`, '')
  if (name === null) return   // 取消
  const r = await post('/api/save', { name })
  if (!r.ok) return status('保存失败：' + r.err, 'err')
  status(`已保存 ${r.steps} 步 → ${r.file}${r.existed ? '（覆盖了原文件）' : ''}`, 'ok')
  if (![...$('case').options].some(o => o.value === r.name)) { $('case').add(new Option(r.name, r.name)); $('replay').disabled = false }
  $('case').value = r.name
}

/** 显示一步（服务端已写盘并校验）。 */
function show(s) {
  const st = s.res || {}
  if (st.settled === false && st.volatile) status(`未静止：一直在变的是 y=${st.volatile[0]}–${st.volatile[1]} 行`, 'busy', ['忽略这段并继续', async () => {
    ignore.push(st.volatile); showIgnore(); const r = await post('/api/ignore', { ignore })
    status(r.ok ? '已忽略（已写入 ' + r.jsonl + '）' : r.err, r.ok ? 'ok' : 'err') }])
  const d = document.createElement('div'); d.className = 'step'
  const desc = { open: '打开', tap: `点按 (${s.x}, ${s.y})`, long: `长按 (${s.x}, ${s.y}) ${s.ms}ms`, swipe: `滑动 (${s.x1},${s.y1})→(${s.x2},${s.y2}) ${s.ms}ms`, back: '返回' }[s.ev]
  d.dataset.imgs = JSON.stringify([{ src: s.shot, cap: `#${s.i} ${desc}` }])
  d.innerHTML = `<img src="${s.shot}"><div><b>#${s.i} ${desc}</b>${st.settled === false ? '<span class="tag warn">未静止(超时)</span>' : ''}${st.changed === false ? '<span class="tag warn">无变化</span>' : ''}
    <small>${s.sel ? (s.sel.text || s.sel.desc || s.sel.id || s.sel.cls) : ''}</small>
    <small>变化 ${st.tChange ?? '-'}ms · 静止 ${st.tSettle ?? '-'}ms · 栈深 ${s.stack?.depth ?? '?'} ${s.stack?.top?.split('/')[1] || ''}</small>
    <small>已写 ${s.file}</small></div>`
  $('steps').prepend(d)
}
// ── 悬停预览：右侧空白区显示被悬停步骤的截图（回放行是 录制 / 回放 两张）──
const hov = $('hover'), hovEmpty = hov.innerHTML
$('steps').addEventListener('mouseover', e => {
  const d = e.target.closest('.step'); if (!d?.dataset.imgs) return
  hov.innerHTML = JSON.parse(d.dataset.imgs).map(x => `<figure><img src="${x.src}"><figcaption>${x.cap}</figcaption></figure>`).join('')
})
$('steps').addEventListener('mouseleave', () => { hov.innerHTML = hovEmpty })

// ── 回放 ──
$('replay').onclick = async () => {
  const pkg = $('case').value; if (!pkg || busy) return
  busy = true; $('steps').innerHTML = ''; status('回放启动…', 'busy')
  const r = await post('/api/replay', { pkg, tol: +$('tol').value / 100 })
  if (!r.ok) { busy = false; return status(r.err, 'err') }
  sess = null
  const rows = new Map()
  for (;;) {
    await new Promise(r => setTimeout(r, 600))
    const j = (await (await fetch('/api/replay')).json()).job
    for (const x of j.results) {
      const want = j.steps.find(s => s.i === x.i)?.want
      let d = rows.get(x.i); if (!d) { d = document.createElement('div'); rows.set(x.i, d); $('steps').prepend(d) }
      d.className = 'step' + (x.ok ? '' : ' fail')
      d.dataset.imgs = JSON.stringify([{ src: want, cap: `#${x.i} 录制` }, ...(x.got ? [{ src: x.got + '?t=' + Date.now(), cap: `#${x.i} 回放` }] : [])])
      d.innerHTML = `<div><b>${x.ok ? '✓' : '✗'} #${x.i} ${x.ev || ''}</b>${x.diff !== undefined ? `<small>差异 ${(x.diff * 100).toFixed(4)}% · ${x.ms}ms</small>` : ''}${x.why ? `<small style="color:var(--bad)">${x.why}</small>` : ''}${x.notes?.length ? `<small>${x.notes.join('；')}</small>` : ''}
        <div class="pair"><figure><img src="${want}"><figcaption>录制</figcaption></figure>${x.got ? `<figure><img src="${x.got}?t=${Date.now()}"><figcaption>回放</figcaption></figure>` : ''}</div></div>`
    }
    const n = j.results.length, bad = j.results.filter(x => !x.ok).length
    status(`回放 ${pkg}：${n}/${j.steps.length} 步，${bad} 步不一致${j.running ? '…' : '（结束）'}${j.error ? ' · ' + j.error : ''}`, j.running ? 'busy' : bad || j.error ? 'err' : 'ok')
    if (!j.running) break
  }
  busy = false
}
const done = r => { if (!r.ok) return status(r.err || '失败', 'err'); show(r.step); if (r.step.res?.settled !== false) status('已记录并写盘', 'ok') }

// ── 鼠标：左键手势（本地收集轨迹，松手时一次性交给 host 按时间轴注入），右键 / Esc 返回 ──
const dev = e => { const r = img.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * geom.w), Math.round((e.clientY - r.top) / r.height * geom.h)] }
const trail = $('trail'), tc = trail.getContext('2d')
let gpts = null, gt0 = 0
function drawTrail() {
  trail.width = img.clientWidth; trail.height = img.clientHeight; tc.clearRect(0, 0, trail.width, trail.height)
  if (!gpts) return
  const k = trail.width / geom.w
  tc.strokeStyle = 'rgba(255,200,0,.9)'; tc.fillStyle = 'rgba(255,200,0,.9)'; tc.lineWidth = 3; tc.lineCap = 'round'
  tc.beginPath(); gpts.forEach(([, x, y], i) => i ? tc.lineTo(x * k, y * k) : tc.moveTo(x * k, y * k)); tc.stroke()
  const [, x, y] = gpts.at(-1); tc.beginPath(); tc.arc(x * k, y * k, 7, 0, 7); tc.fill()
}
img.addEventListener('pointerdown', async e => {
  if (e.button !== 0 || !sess) return
  if (busy) return status('上一步还在等待画面静止…', 'busy')
  e.preventDefault(); img.setPointerCapture(e.pointerId)
  const [x, y] = dev(e); gt0 = e.timeStamp; gpts = [[0, x, y]]; drawTrail(); post('/api/g/down', { x, y })
})
img.addEventListener('pointermove', e => {
  if (!gpts) return
  const [x, y] = dev(e); gpts.push([e.timeStamp - gt0, x, y]); drawTrail()
})
img.addEventListener('pointerup', async e => {
  if (!gpts) return
  const [x, y] = dev(e); gpts.push([e.timeStamp - gt0, x, y])
  const pts = gpts; busy = true; status('注入并等待画面变化 → 静止…', 'busy')
  const r = await post('/api/g', { pts, wait: waitOpts() })
  gpts = null; drawTrail(); done(r); busy = false
})
img.addEventListener('pointercancel', () => { gpts = null; drawTrail() })
async function back() {
  if (!sess) return
  if (busy) return status('上一步还在等待画面静止…', 'busy')
  busy = true; status('返回，等待画面…', 'busy')
  done(await post('/api/back', { wait: waitOpts() })); busy = false
}
img.addEventListener('contextmenu', e => { e.preventDefault(); back() })
addEventListener('keydown', e => { if (e.key === 'Escape' && !e.target.matches('input,select')) { e.preventDefault(); back() } })

loadInfo()
</script>
</body>
</html>
